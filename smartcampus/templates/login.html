{% extends 'base.html' %}{% block title %}Login{% endblock %}
{% block content %}
<div class="card narrow">
  <h1>Log in</h1>
  <p class="muted">Smart Campus – {{ college }}</p>
  <form method="post">
    <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
    <label>Email<input type="email" name="email" required autofocus autocomplete="username"></label>
    <label>Password<input type="password" name="password" required autocomplete="current-password"></label>
    <button class="btn" type="submit">Login</button>
  </form>
  <p><a href="{{ url_for('auth.forgot') }}">Forgot password?</a></p>
</div>
{% endblock %}
