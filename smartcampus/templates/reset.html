{% extends 'base.html' %}{% block title %}Reset password{% endblock %}
{% block content %}
<div class="card narrow"><h1>Choose a new password</h1>
  <form method="post"><input type="hidden" name="_csrf" value="{{ csrf_token() }}">
    <label>New password<input type="password" name="password" required minlength="8" autocomplete="new-password"></label>
    <label>Confirm password<input type="password" name="confirm" required minlength="8" autocomplete="new-password"></label>
    <p class="muted">At least 8 characters, with letters and digits.</p>
    <button class="btn" type="submit">Update password</button></form></div>
{% endblock %}
